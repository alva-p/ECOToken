services:
  postgres:
    image: postgres:16
    container_name: ecotoken-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecotoken
      POSTGRES_PASSWORD: ecotoken
      POSTGRES_DB: ecotoken
    ports:
      - "5432:5432"
    volumes:
      - ecotoken_postgres_data:/var/lib/postgresql/data

volumes:
  ecotoken_postgres_data:
