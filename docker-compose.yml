services:
  postgres:
    image: postgres:16
    container_name: ecotoken-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecotoken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotoken}
      POSTGRES_DB: ${POSTGRES_DB:-ecotoken}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecotoken_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecotoken}"]
      interval: 10s
      timeout: 5s
      retries: 5

